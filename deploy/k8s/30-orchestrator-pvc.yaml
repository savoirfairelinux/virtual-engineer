# Persistent volume for the SQLite state store (WAL mode). ReadWriteOnce is
# sufficient because the orchestrator runs as a single replica (business
# admission/scheduling is owned by VE, not Kubernetes).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: REPLACE_WITH_VE_DATA_PVC_NAME
  namespace: virtual-engineer
spec:
  # deploy.sh substitutes this with VE_ENCRYPTED_STORAGE_CLASS. Verify that
  # the selected CSI StorageClass encrypts this volume at rest.
  storageClassName: REPLACE_WITH_VERIFIED_ENCRYPTED_STORAGE_CLASS
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
