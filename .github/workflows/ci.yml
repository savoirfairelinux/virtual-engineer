name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install agent-worker dependencies
        run: cd agent-worker && npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Audit dev-tooling dependencies (informational)
        run: npm audit --audit-level=high || true

      - name: Audit agent-worker production dependencies
        run: cd agent-worker && npm audit --omit=dev

      - name: Audit agent-worker dev-tooling dependencies (informational)
        run: cd agent-worker && npm audit --audit-level=high || true

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Provide OpenLDAP for directory tests
        # The install brings slapd's shared libraries; tests run an extracted copy that the system AppArmor profile does not confine.
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends slapd
          cd "$RUNNER_TEMP" && apt-get download slapd && dpkg -x slapd_*.deb slapd-root
          echo "VE_SLAPD_ROOT=$RUNNER_TEMP/slapd-root" >> "$GITHUB_ENV"

      - name: Test with coverage
        run: npm run test:coverage
        env:
          VE_REQUIRE_LDAP_TESTS: "1"

      - name: Build
        run: npm run build
